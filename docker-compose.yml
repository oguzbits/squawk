services:
  floci:
    image: floci/floci:2.3.0
    container_name: floci
    ports:
      - '127.0.0.1:4566:4566'
      # RDS proxy ports, one per DB instance
      - '127.0.0.1:7001-7005:7001-7005'
    volumes:
      # Floci runs RDS (and later Lambda, ElastiCache) as sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
